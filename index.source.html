for(var i=0;i<state.previewItems.length;i++){var item=state.previewItems[i];statusEl.textContent='导入中 '+(i+1)+'/'+state.previewItems.length;try{var project=findProject(item.project);if(!project){skipped++;continue;}var tagIds=resolveTags(item.tags),marker='<!-- sp:plan:'+item.planId+' -->',existing=findTaskByPlanId(item.planId),baseNotes=stripMarker(item.notes),notes=baseNotes?baseNotes+'\n\n'+marker:marker;if(existing&&updateExisting){var patch={title:item.title,notes:notes,timeEstimate:item.estimate,projectId:project.id,tagIds:tagIds};if(item.start){var parts=item.start.split(':');patch.dueWithTime=new Date(item.date+'T'+parts[0]+':'+parts[1]+':00').getTime();patch.dueDay=null;}else{patch.dueDay=item.date;patch.dueWithTime=null;}await PluginAPI.updateTask(existing.id,patch);state.data.imports[item.planId]=existing.id;updated++;}else if(existing){skipped++;}else{var newId=await PluginAPI.addTask({title:item.title,projectId:project.id,tagIds:tagIds,notes:notes,timeEstimate:item.estimate,dueDay:item.date,isDone:false});if(item.start){var p=item.start.split(':');await PluginAPI.updateTask(newId,{dueWithTime:new Date(item.date+'T'+p[0]+':'+p[1]+':00').getTime(),dueDay:null});}state.data.imports[item.planId]=newId;created++;}await persist();}catch(e){console.error('[每日复盘] 导入单项失败',item,e);failed++;}}
toast('导入完成：新建 '+created+'，更新 '+updated+'，跳过 '+skipped+'，失败 '+failed,failed>0);if(typeof PluginAPI.showSnack==='function')PluginAPI.showSnack({msg:'计划导入完成：新建 '+created+'，更新 '+updated,type:failed?'WARNING':'SUCCESS'});state.importing=false;await loadAll();state.tab='day';render();
}finally{state.importing=false;}
}
async function exportReview(){
var payload={exportedAt:new Date().toISOString(),source:'Super Productivity / daily-review',data:state.data,taskTypes:state.taskTypes,generatedSummary:{}},days=Object.keys(state.data.days).sort();
days.forEach(function(day){payload.generatedSummary[day]=dayMetrics(day);});var text=JSON.stringify(payload,null,2);
try{if(typeof PluginAPI.downloadFile==='function')await PluginAPI.downloadFile('daily-review-'+todayStr()+'.json',text);else{var blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-review-'+todayStr()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}toast('复盘数据已导出');}catch(e){toast('导出失败：'+e.message,true);}
}
document.getElementById('tabs').addEventListener('click',function(e){var btn=e.target.closest('[data-tab]');if(!btn)return;closeTaskDrawer();state.tab=btn.getAttribute('data-tab');render();});
document.getElementById('refresh-btn').addEventListener('click',function(){loadAll();});
document.getElementById('undo-move-btn').addEventListener('click',function(){var change=state.data.scheduleHistory&&state.data.scheduleHistory[0];if(change)undoScheduleChange(change);});
document.getElementById('export-btn').addEventListener('click',exportReview);
wireDrawer();
wireDayCloseModal();
wireCannotModal();
wireCreateTaskModal();
document.getElementById('create-task-btn').addEventListener('click',function(){if(!state.loaded){toast('插件仍在加载，请稍后再试',true);return;}openCreateTaskModal(state.tab==='day'?state.day:todayStr());});
loadAll();
})();</script>
