<div class="app">
<div class="topbar">
<div class="brand"><div class="brand-mark">✓</div><div><div class="brand-title">每日复盘与计划</div><div class="brand-sub" id="subtitle">正在读取任务…</div></div></div>
<div class="spacer"></div>
<div class="tabs" id="tabs">
<button class="tab active" data-tab="day" type="button">每日</button>
<button class="tab" data-tab="calendar" type="button">热力图</button>

<button class="tab" data-tab="archive" type="button">归档</button>
<button class="tab" data-tab="import" type="button">导入计划</button>
</div>
<button class="btn primary" id="create-task-btn" type="button">＋ 新建任务</button>
<button class="btn" id="undo-move-btn" type="button" disabled>撤销改期</button>
<button class="btn" id="export-btn" type="button">导出复盘</button>
<button class="btn icon-btn" id="refresh-btn" type="button" title="刷新">↻</button>
</div>
<div id="view"><div class="loading">正在读取 Super Productivity 数据…</div></div>
<div class="toast" id="toast"></div>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="task-drawer" id="task-drawer" aria-hidden="true">
<div class="drawer-head"><div><div class="drawer-kicker">任务详情</div><div class="drawer-title" id="drawer-title"></div></div><button class="drawer-close" id="drawer-close" type="button">×</button></div>
<div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="heat-tip" id="heat-tip"></div>
<div class="close-day-backdrop" id="close-day-backdrop"></div>
<section class="close-day-modal" id="close-day-modal" role="dialog" aria-modal="true" aria-labelledby="close-day-title" aria-hidden="true">
<div class="close-day-head"><div><h3 id="close-day-title">结束今天</h3><p id="close-day-subtitle">逐项处理今天仍未完成的任务</p></div><button class="drawer-close" id="close-day-close" type="button" aria-label="关闭日结">×</button></div>
<div class="close-day-body" id="close-day-body"></div>
<div class="close-day-actions"><button class="btn" id="close-day-cancel" type="button">取消</button><button class="btn primary" id="close-day-confirm" type="button">完成日结</button></div>
</section>
<div class="close-day-backdrop" id="cannot-task-backdrop"></div>
<section class="close-day-modal" id="cannot-task-modal" role="dialog" aria-modal="true" aria-labelledby="cannot-task-title" aria-hidden="true">
<div class="close-day-head"><div><h3 id="cannot-task-title">无法完成</h3><p>任务不会计为完成，并会从当前计划中移除</p></div><button class="drawer-close" id="cannot-task-close" type="button" aria-label="关闭">×</button></div>
<div class="close-day-body" id="cannot-task-body"></div>
<div class="close-day-actions"><button class="btn" id="cannot-task-cancel" type="button">取消</button><button class="btn primary" id="cannot-task-confirm" type="button">确认无法完成</button></div>
</section>
<div class="close-day-backdrop" id="create-task-backdrop"></div>
<section class="close-day-modal task-create-modal" id="create-task-modal" role="dialog" aria-modal="true" aria-labelledby="create-task-title" aria-hidden="true">
<div class="close-day-head"><div><h3 id="create-task-title">新建任务</h3><p>创建后会立即同步到 Super Productivity</p></div><button class="drawer-close" id="create-task-close" type="button" aria-label="关闭新建任务">×</button></div>
<form id="create-task-form"><div class="close-day-body task-create-body"><label class="task-create-field"><span>任务标题</span><input id="create-task-name" type="text" maxlength="500" autocomplete="off" placeholder="要做什么？" required /></label><div class="task-create-grid"><label class="task-create-field"><span>日期</span><input id="create-task-date" type="date" required /></label><label class="task-create-field"><span>项目</span><select id="create-task-project"></select></label><label class="task-create-field"><span>预计分钟</span><input id="create-task-estimate" type="number" min="0" max="1440" step="5" value="30" /></label><label class="task-create-field"><span>开始时间（可选）</span><input id="create-task-time" type="time" /></label></div><label class="task-create-field"><span>备注（可选）</span><textarea id="create-task-notes" maxlength="4000"></textarea></label></div><div class="close-day-actions"><button class="btn" id="create-task-cancel" type="button">取消</button><button class="btn primary" id="create-task-submit" type="submit">创建并同步</button></div></form>
</section>
