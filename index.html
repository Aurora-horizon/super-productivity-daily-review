<script>(function () {

['time','时间不够'],['interrupt','被打断'],['priority','优先级变化'],

function addDays(s,n) { var d = parseDay(s); d.setDate(d.getDate()+n); return dateStr(d); }

function weekdayCN(s) { return ['周日','周一','周二','周三','周四','周五','周六'][parseDay(s).getDay()]; }

function compactTask(t) { return { id:t.id,title:t.title||'(无标题)',projectId:t.projectId||null,parentId:t.parentId||null,timeEstimate:Number(t.timeEstimate||0),timeSpent:Number(t.timeSpent||0),isDone:!!t.isDone,doneOn:typeof t.doneOn==='number'?t.doneOn:null,dueDay:t.dueDay||null,dueWithTime:typeof t.dueWithTime==='number'?t.dueWithTime:null,notes:t.notes||'',tagIds:Array.isArray(t.tagIds)?t.tagIds.slice():[],updated:t.updated||t.modified||null }; }

function reconcileSnapshots() {
var all = state.tasks.concat(state.archived);
var known = Object.create(null);
all.forEach(function (task) { if (task && task.id) known[task.id] = true; });
// Deleted tasks are not part of the live task database anymore. Remove
// their entries so the review view cannot keep counting stale duplicates.
Object.keys(state.data.days).forEach(function (day) {
var bucket = state.data.days[day] && state.data.days[day].tasks;
if (!bucket) return;
Object.keys(bucket).forEach(function (id) { if (!known[id]) delete bucket[id]; });
});
Object.keys(state.data.completions).forEach(function (day) {
var bucket = state.data.completions[day];
if (!bucket) return;
Object.keys(bucket).forEach(function (id) { if (!known[id]) delete bucket[id]; });
});
// Today and future are live views. Rebuild them from active tasks so
// deleting or rescheduling duplicated tasks updates immediately.
var today = todayStr();
Object.keys(state.data.days).forEach(function (day) {

Object.keys(state.data.completions).forEach(function (day) {
if (day >= today) state.data.completions[day] = {};

if (!state.data.days[planned]) state.data.days[planned] = { tasks: {} };
if (!state.data.days[planned].tasks) state.data.days[planned].tasks = {};

});
all.forEach(function (task) {
var item = compactTask(task);

if (hooksReady) return;
hooksReady = true;

try { PluginAPI.registerHook(hook, function () { scheduleRefresh(120); }); }
catch (e) { console.warn('[每日复盘] hook 注册失败', hook, e); }
});
window.addEventListener('focus', function () { scheduleRefresh(250); });
document.addEventListener('visibilitychange', function () {
if (document.visibilityState === 'visible') scheduleRefresh(250);
});
}

tasks.forEach(function(t,idx){if(!t||typeof t!=='object'){warnings.push('第 '+(idx+1)+' 项不是对象');return;}var title=String(t.title||'').trim(),date=String(t.date||t.dueDay||defaults.date||'').trim();if(!title){warnings.push('第 '+(idx+1)+' 项缺少 title');return;}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){warnings.push('“'+title+'”缺少合法 date（YYYY-MM-DD）');return;}var planId=String(t.id||t.planId||hashString(date+'|'+title+'|'+idx)),estimate=Number(t.timeEstimate);if(!estimate){var mins=Number(t.estimateMinutes!=null?t.estimateMinutes:(defaults.estimateMinutes||0));estimate=mins?mins*60000:0;}var start=t.start||t.time||'';if(start&&!/^\d{2}:\d{2}$/.test(start)){warnings.push('“'+title+'”的 start 不是 HH:MM，已改为一整天任务');start='';}var tags=Array.isArray(t.tags)?t.tags:(Array.isArray(t.tagIds)?t.tagIds:(defaults.tags||[]));items.push({planId:planId,date:date,title:title,project:t.project||t.projectId||defaults.project||'',tags:Array.isArray(tags)?tags:[],estimate:estimate,start:start,notes:String(t.notes||''),raw:t});});
if(!items.length)throw new Error('没有可导入的有效任务。'+(warnings.length?' '+warnings.join('；'):''));
if(items.length>100)throw new Error('单次最多导入 100 个任务。');
return {items:items,warnings:warnings};
}
function hashString(s) { var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ('00000000'+(h>>>0).toString(16)).slice(-8); }
function renderImport() {
var example='{\n  "version": 1,\n  "defaults": { "project": "工作", "estimateMinutes": 30 },\n  "tasks": [\n    { "id": "2026-10-24-1", "date": "2026-10-24", "title": "写周报", "start": "09:30", "estimateMinutes": 45 },\n    { "id": "2026-10-24-2", "date": "2026-10-24", "title": "整理下周计划", "estimateMinutes": 20, "tags": ["规划"] }\n  ]\n}';
var preview=state.previewItems.length?state.previewItems.map(function(item){return '<div class="preview-item"><span class="pdate">'+escapeHtml(item.date)+'</span><span class="ptitle">'+escapeHtml(item.title)+(item.start?' · '+escapeHtml(item.start):'')+'</span></div>';}).join(''):'<div class="empty">粘贴或选择 JSON 后点击“预览”</div>';
var traePrompt = '你是我的 Super Productivity 每日计划助手。\n\n' +
'当我用自然语言告诉你日期和任务时：\n' +
'1. 结合我给出的可用时间、固定日程、任务优先级和预计时长，生成可执行计划。\n' +
'2. 严格遵守计划 JSON 结构，任务 ID 使用 YYYY-MM-DD-序号，同一天重复生成时保持稳定。\n' +
'3. 将 JSON 保存为 plan.json。\n' +
'4. 运行：powershell -ExecutionPolicy Bypass -File "sp-plan.ps1" -PlanFile ".\\plan.json"\n' +
'5. 把脚本输出的新建、更新、跳过、失败数量告诉我，不要反复创建相同任务。\n\n' +
'计划 JSON 结构：\n' +
'{"version":1,"defaults":{"project":"工作","estimateMinutes":30},"tasks":[{"id":"YYYY-MM-DD-1","date":"YYYY-MM-DD","title":"具体可执行任务","start":"HH:MM","estimateMinutes":45,"project":"项目标题","tags":["标签"],"notes":"补充信息"}]}\n\n' +
'排程规则：固定日程优先；任务之间至少 10 分钟缓冲；单个任务 25-90 分钟；不要把任务排到可用时间之外；只使用我已有的项目和标签。';
var bridge = '<div class="bridge-card"><h3>推荐：让 Trae 直接写入任务</h3>' +
'<p>先到“设置 → 杂项”开启本地 REST API。之后把下面的指令复制给 Trae，你只需要说“明天安排……”，Trae 会生成 plan.json 并直接写入 Super Productivity，不需要手动导入。</p>' +
'<ol class="bridge-steps"><li>Super Productivity 保持运行</li><li>启用本地 REST API</li><li>把 Trae 指令保存为它的项目规则或直接粘贴</li><li>对 Trae 说出当天任务</li></ol>' +
'<div class="bridge-tools"><button class="btn primary" id="copy-trae-prompt" type="button">复制 Trae 指令</button><span class="pill">需要 sp-plan.ps1</span></div></div>';
document.getElementById('view').innerHTML=bridge+'<div class="toolbar"><div class="date-title">导入 Trae 计划</div><span class="pill">插件负责写入 Super Productivity</span></div><div class="import-grid"><div class="panel"><div class="panel-head"><div class="panel-title">计划 JSON</div><div class="spacer"></div><div class="panel-sub">最多 100 项 / 次</div></div><div class="panel-body"><div class="file-row"><input type="file" id="plan-file" accept=".json,application/json" /><button class="btn" id="load-example" type="button">填入示例</button></div><textarea class="textarea" id="plan-text" placeholder="粘贴 Trae 生成的计划 JSON…"></textarea><div class="check-row"><input type="checkbox" id="update-existing" checked /><label for="update-existing">同一计划 ID 已存在时更新任务（保留完成状态）</label></div><div class="file-row"><button class="btn" id="preview-btn" type="button">预览</button><button class="btn primary" id="import-btn" type="button">导入任务</button><span class="pill" id="import-status"></span></div><div class="schema">最少字段：<code>date</code>、<code>title</code>。可选：<code>id</code>、<code>project</code>、<code>tags</code>、<code>start</code>、<code>estimateMinutes</code>、<code>notes</code>。包含 <code>start</code> 时会排到具体时间。</div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">导入预览</div></div><div class="panel-body"><div class="preview-list">'+preview+'</div>'+(state.previewWarnings.length?'<div class="schema" style="color:var(--warn)">'+state.previewWarnings.map(escapeHtml).join('<br>')+'</div>':'')+'</div></div></div>';
document.getElementById('load-example').addEventListener('click',function(){document.getElementById('plan-text').value=example;});
document.getElementById('copy-trae-prompt').addEventListener('click',async function(){try{await navigator.clipboard.writeText(traePrompt);toast('Trae 指令已复制');}catch(e){var ta=document.createElement('textarea');ta.value=traePrompt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Trae 指令已复制');}});
document.getElementById('plan-file').addEventListener('change',function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){document.getElementById('plan-text').value=String(reader.result||'');};reader.readAsText(file,'utf-8');});
document.getElementById('preview-btn').addEventListener('click',previewImport);
document.getElementById('import-btn').addEventListener('click',runImport);
}
function previewImport() { try{var parsed=parsePlanText(document.getElementById('plan-text').value);state.previewItems=parsed.items;state.previewWarnings=parsed.warnings;renderImport();toast('已解析 '+parsed.items.length+' 项计划');}catch(e){state.previewItems=[];state.previewWarnings=[e.message];renderImport();toast(e.message,true);} }
function findProject(value) { if(!value){var inbox=Array.from(state.projectMap.values()).find(function(p){return p.id==='INBOX_PROJECT';});return inbox||null;}var v=String(value).trim().toLowerCase();return Array.from(state.projectMap.values()).find(function(p){return String(p.id).toLowerCase()===v||String(p.title||'').toLowerCase()===v;})||null; }
function resolveTags(values) { var ids=[];(values||[]).forEach(function(value){var v=String(value).trim().toLowerCase(),tag=Array.from(state.tagMap.values()).find(function(t){return String(t.id).toLowerCase()===v||String(t.title||'').toLowerCase()===v;});if(tag&&ids.indexOf(tag.id)===-1)ids.push(tag.id);});return ids; }
function findTaskByPlanId(planId) { if(state.data.imports[planId]&&state.taskMap.has(state.data.imports[planId]))return state.taskMap.get(state.data.imports[planId]);var marker='<!-- sp:plan:'+planId+' -->';return state.tasks.concat(state.archived).find(function(t){return String(t.notes||'').indexOf(marker)!==-1;})||null; }
async function runImport() {
if(state.importing)return;
if(!state.previewItems.length){try{var parsed=parsePlanText(document.getElementById('plan-text').value);state.previewItems=parsed.items;state.previewWarnings=parsed.warnings;}catch(e){toast(e.message,true);return;}}
var updateExisting=document.getElementById('update-existing').checked;state.importing=true;var statusEl=document.getElementById('import-status'),created=0,updated=0,skipped=0,failed=0;
try{
for(var i=0;i<state.previewItems.length;i++){var item=state.previewItems[i];statusEl.textContent='导入中 '+(i+1)+'/'+state.previewItems.length;try{var project=findProject(item.project);if(!project){skipped++;continue;}var tagIds=resolveTags(item.tags),marker='<!-- sp:plan:'+item.planId+' -->',existing=findTaskByPlanId(item.planId),baseNotes=stripMarker(item.notes),notes=baseNotes?baseNotes+'\n\n'+marker:marker;if(existing&&updateExisting){var patch={title:item.title,notes:notes,timeEstimate:item.estimate,projectId:project.id,tagIds:tagIds};if(item.start){var parts=item.start.split(':');patch.dueWithTime=new Date(item.date+'T'+parts[0]+':'+parts[1]+':00').getTime();patch.dueDay=null;}else{patch.dueDay=item.date;patch.dueWithTime=null;}await PluginAPI.updateTask(existing.id,patch);state.data.imports[item.planId]=existing.id;updated++;}else if(existing){skipped++;}else{var newId=await PluginAPI.addTask({title:item.title,projectId:project.id,tagIds:tagIds,notes:notes,timeEstimate:item.estimate,dueDay:item.date,isDone:false});if(item.start){var p=item.start.split(':');await PluginAPI.updateTask(newId,{dueWithTime:new Date(item.date+'T'+p[0]+':'+p[1]+':00').getTime(),dueDay:null});}state.data.imports[item.planId]=newId;created++;}await persist();}catch(e){console.error('[每日复盘] 导入单项失败',item,e);failed++;}}
toast('导入完成：新建 '+created+'，更新 '+updated+'，跳过 '+skipped+'，失败 '+failed,failed>0);if(typeof PluginAPI.showSnack==='function')PluginAPI.showSnack({msg:'计划导入完成：新建 '+created+'，更新 '+updated,type:failed?'WARNING':'SUCCESS'});state.importing=false;await loadAll();state.tab='day';render();
}finally{state.importing=false;}
}
async function exportReview() {
var payload={exportedAt:new Date().toISOString(),source:'Super Productivity / daily-review',data:state.data,generatedSummary:{}},days=Object.keys(state.data.days).sort();
days.forEach(function(day){payload.generatedSummary[day]=dayMetrics(day);});var text=JSON.stringify(payload,null,2);
try{if(typeof PluginAPI.downloadFile==='function')await PluginAPI.downloadFile('daily-review-'+todayStr()+'.json',text);else{var blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily-review-'+todayStr()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}toast('复盘数据已导出');}catch(e){toast('导出失败：'+e.message,true);}
}
document.getElementById('tabs').addEventListener('click',function(e){var btn=e.target.closest('[data-tab]');if(!btn)return;closeTaskDrawer();state.tab=btn.getAttribute('data-tab');render();});
document.getElementById('refresh-btn').addEventListener('click',function(){loadAll();});
document.getElementById('export-btn').addEventListener('click',exportReview);
wireDrawer();
wireDayCloseModal();
loadAll();
})();</script>
